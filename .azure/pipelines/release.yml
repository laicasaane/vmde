trigger:
  branches:
    exclude:
      - '*'
  tags:
    include:
      - '*'

pr: none

pool:
  name: U2602

jobs:
  - job: release
    displayName: Production Marketplace VSIX
    steps:
      - checkout: self
        fetchDepth: 0
        fetchTags: true
        persistCredentials: false

      - task: UseNode@1
        inputs:
          version: '24.x'

      - script: |
          set -euo pipefail
          case "${BUILD_SOURCEBRANCH}" in
            refs/tags/*) tag="${BUILD_SOURCEBRANCH#refs/tags/}" ;;
            *) echo "Production publishing requires a refs/tags/ source ref" >&2; exit 1 ;;
          esac
          [ -n "${SYSTEM_ACCESSTOKEN}" ] || { echo "Production validation requires System.AccessToken" >&2; exit 1; }
          node scripts/version-contract.mjs release "${tag}" package.json package-lock.json --azure
          git -c http.extraheader="AUTHORIZATION: bearer ${SYSTEM_ACCESSTOKEN}" fetch origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "${BUILD_SOURCEVERSION}" "refs/remotes/origin/main"
        displayName: Validate production tag and main reachability
        env:
          BUILD_SOURCEBRANCH: $(Build.SourceBranch)
          BUILD_SOURCEVERSION: $(Build.SourceVersion)
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)

      - script: npm ci --strict-allow-scripts --no-audit --no-fund
        displayName: Install root dependencies

      - script: npm --prefix media-src ci --strict-allow-scripts --no-audit --no-fund
        displayName: Install webview dependencies

      - script: npm run audit:host
        displayName: Audit host dependencies

      - script: npm run audit:webview
        displayName: Audit webview dependencies

      - script: npm run audit:vendor
        displayName: Audit vendored runtimes

      - script: npm run audit:d2-go
        displayName: Audit D2 Go call graph

      - script: npm test
        displayName: Run unit tests

      - script: |
          set -euo pipefail
          VSIX="artifacts/vmde-${VMDE_VERSION}.vsix"
          npm run package:vsix -- --out "$VSIX"
        displayName: Package production VSIX

      - script: |
          set -euo pipefail
          VSIX="artifacts/vmde-${VMDE_VERSION}.vsix"
          unzip -p "$VSIX" extension/package.json |
            node -e 'let json = ""; process.stdin.on("data", (chunk) => json += chunk); process.stdin.on("end", () => { if (JSON.parse(json).version !== process.argv[1]) process.exit(1) })' "${VMDE_VERSION}"
          unzip -p "$VSIX" extension.vsixmanifest |
            grep -Fq "Version=\"${VMDE_VERSION}\""
          if unzip -p "$VSIX" extension.vsixmanifest | grep -q 'Microsoft.VisualStudio.Code.PreRelease.*Value="true"'; then
            exit 1
          fi
        displayName: Verify production archive metadata

      - task: PublishPipelineArtifact@1
        inputs:
          targetPath: "artifacts/vmde-$(VMDE_VERSION).vsix"
          artifact: vmde-production-vsix
        displayName: Publish production VSIX artifact

      - task: AzureCLI@2
        displayName: Publish production VSIX to Marketplace
        inputs:
          azureSubscription: 'Visual Studio Marketplace'
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            VSIX="artifacts/vmde-${VMDE_VERSION}.vsix"
            npx @vscode/vsce publish \
              --azure-credential \
              --packagePath "$VSIX"

  - job: archive_logs
    displayName: Archive Azure DevOps logs
    dependsOn: release
    condition: always()
    steps:
      - checkout: none

      - script: |
          set -euo pipefail
          destination="${HOME}/Azure/Logs/${SYSTEM_TEAMPROJECT}/${BUILD_DEFINITIONNAME}/${BUILD_BUILDID}"
          mkdir -p "$destination"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${SYSTEM_ACCESSTOKEN}" \
            --header "Accept: application/zip" \
            --output "${destination}/logs.zip" \
            "${SYSTEM_COLLECTIONURI}${SYSTEM_TEAMPROJECTID}/_apis/build/builds/${BUILD_BUILDID}/logs?api-version=7.1"
        displayName: Archive Azure DevOps run logs
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          SYSTEM_COLLECTIONURI: $(System.CollectionUri)
          SYSTEM_TEAMPROJECT: $(System.TeamProject)
          SYSTEM_TEAMPROJECTID: $(System.TeamProjectId)
          BUILD_DEFINITIONNAME: $(Build.DefinitionName)
          BUILD_BUILDID: $(Build.BuildId)

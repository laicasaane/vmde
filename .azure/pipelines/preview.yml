trigger:
  branches:
    include:
      - main

pr: none

pool:
  name: U2602

jobs:
  - job: preview
    displayName: Preview Marketplace VSIX
    steps:
      - checkout: self

      - task: UseNode@1
        inputs:
          version: '24.x'

      - script: |
          set -euo pipefail
          if [ "${BUILD_SOURCEBRANCH}" != "refs/heads/main" ]; then
            echo "Preview publishing requires refs/heads/main" >&2
            exit 1
          fi
        displayName: Validate preview branch
        env:
          BUILD_SOURCEBRANCH: $(Build.SourceBranch)

      - script: npm ci --strict-allow-scripts --no-audit --no-fund
        displayName: Install root dependencies

      - script: npm --prefix media-src ci --strict-allow-scripts --no-audit --no-fund
        displayName: Install webview dependencies

      - script: npm run audit:host
        displayName: Audit host dependencies

      - script: npm run audit:webview
        displayName: Audit webview dependencies

      - script: npm run audit:vendor
        displayName: Audit vendored runtimes

      - script: npm run audit:d2-go
        displayName: Audit D2 Go call graph

      - script: npm test
        displayName: Run unit tests

      - script: |
          set -euo pipefail
          preview_version="$(node scripts/version-contract.mjs preview package.json package-lock.json "${BUILD_BUILDID}")"
          echo "##vso[task.setvariable variable=VMDE_VERSION;isReadOnly=true]${preview_version}"
          npm version "$preview_version" --no-git-tag-version --ignore-scripts
        displayName: Derive disposable preview version
        env:
          BUILD_BUILDID: $(Build.BuildId)

      - script: |
          set -euo pipefail
          VSIX="artifacts/vmde-${VMDE_VERSION}-preview.vsix"
          npm run package:vsix -- --pre-release --out "$VSIX"
        displayName: Package prerelease VSIX

      - script: |
          set -euo pipefail
          VSIX="artifacts/vmde-${VMDE_VERSION}-preview.vsix"
          unzip -p "$VSIX" extension/package.json |
            node -e 'let json = ""; process.stdin.on("data", (chunk) => json += chunk); process.stdin.on("end", () => { if (JSON.parse(json).version !== process.argv[1]) process.exit(1) })' "${VMDE_VERSION}"
          unzip -p "$VSIX" extension.vsixmanifest |
            grep -Fq "Version=\"${VMDE_VERSION}\""
          unzip -p "$VSIX" extension.vsixmanifest |
            grep -q 'Microsoft.VisualStudio.Code.PreRelease.*Value="true"'
        displayName: Verify prerelease archive metadata

      - task: PublishPipelineArtifact@1
        inputs:
          targetPath: "artifacts/vmde-$(VMDE_VERSION)-preview.vsix"
          artifact: vmde-preview-vsix
        displayName: Publish preview VSIX artifact

      - task: AzureCLI@2
        displayName: Publish preview VSIX to Marketplace
        inputs:
          azureSubscription: 'Visual Studio Marketplace'
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            VSIX="artifacts/vmde-${VMDE_VERSION}-preview.vsix"
            npx @vscode/vsce publish \
              --azure-credential \
              --packagePath "$VSIX" \
              --pre-release

  - job: archive_logs
    displayName: Archive Azure DevOps logs
    dependsOn: preview
    condition: always()
    steps:
      - checkout: none

      - script: |
          set -euo pipefail
          destination="${HOME}/Azure/Logs/${SYSTEM_TEAMPROJECT}/${BUILD_DEFINITIONNAME}/${BUILD_BUILDID}"
          mkdir -p "$destination"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${SYSTEM_ACCESSTOKEN}" \
            --header "Accept: application/zip" \
            --output "${destination}/logs.zip" \
            "${SYSTEM_COLLECTIONURI}${SYSTEM_TEAMPROJECTID}/_apis/build/builds/${BUILD_BUILDID}/logs?api-version=7.1"
        displayName: Archive Azure DevOps run logs
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          SYSTEM_COLLECTIONURI: $(System.CollectionUri)
          SYSTEM_TEAMPROJECT: $(System.TeamProject)
          SYSTEM_TEAMPROJECTID: $(System.TeamProjectId)
          BUILD_DEFINITIONNAME: $(Build.DefinitionName)
          BUILD_BUILDID: $(Build.BuildId)

<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>selection cost harness</title>
    <link rel="stylesheet" href="/vditor/dist/index.css" />
    <link rel="stylesheet" href="/main.css" />
  </head>
  <body>
    <!-- Task 012-16 M-1: an IR-like editable root rendered by Lute, plus a focus target outside it. -->
    <input id="outside" type="text" aria-label="focus target outside the editable root" />
    <div class="vditor vditor--ir">
      <div class="vditor-content">
        <div class="vditor-ir">
          <pre id="root" class="vditor-reset" contenteditable="true" spellcheck="false"></pre>
        </div>
      </div>
    </div>
    <script src="/vditor/dist/js/lute/lute.min.js"></script>
    <script src="/selection-cost.js"></script>
  </body>
</html>
